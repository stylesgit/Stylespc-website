// Attach login handler programmatically after DOM is ready
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('loginForm');
    if (form) {
        form.addEventListener('submit', handleLogin);
        console.log('✅ Login form listener attached');
    } else {
        console.error('❌ Login form not found!');
    }
    // Also check session on load
    checkSession();
});

async function handleLogin(e) {
    e.preventDefault();
    console.log('🔐 handleLogin called');

    const emailInput = document.getElementById('loginEmail');
    const passwordInput = document.getElementById('loginPassword');
    const errorEl = document.getElementById('loginError');

    // Clear previous error
    errorEl.textContent = '';

    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!email || !password) {
        errorEl.textContent = 'Please enter both email and password.';
        console.warn('⚠️ Missing email or password');
        return;
    }

    try {
        console.log('📤 Attempting sign in with:', email);

        const { data, error } = await sb.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            console.error('❌ Supabase auth error:', error);
            errorEl.textContent = '❌ ' + error.message;
            return;
        }

        console.log('✅ Login successful, user:', data.user);
        await afterLogin(data.user);

    } catch (err) {
        console.error('💥 Unexpected error in handleLogin:', err);
        errorEl.textContent = '💥 Unexpected error – see console (F12) for details.';
    }
}

async function afterLogin(user) {
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';

    try {
        console.log('👤 afterLogin called for user:', user.id);

        // ---- 1. Fetch or create profile ----
        let { data: profile, error: profileError } = await sb
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .single();

        if (profileError && profileError.code !== 'PGRST116') {
            console.error('❌ Profile fetch error:', profileError);
            errorEl.textContent = '❌ Database error: ' + profileError.message;
            return;
        }

        if (!profile) {
            console.log('🆕 No profile found, creating one...');
            const newProfile = {
                id: user.id,
                role: 'User',
                must_change_password: false,
                password_expiry: new Date(Date.now() + 30*864e5).toISOString(),
            };
            const { error: insertError } = await sb.from('profiles').insert([newProfile]);
            if (insertError) {
                console.error('❌ Profile insert error:', insertError);
                errorEl.textContent = '❌ Failed to create profile: ' + insertError.message +
                    '. Check RLS policies.';
                return;
            }
            profile = newProfile;
            console.log('✅ Profile created');
        } else {
            console.log('✅ Profile found:', profile);
        }

        // ---- 2. Set current user ----
        currentUser = { ...user, ...profile };
        document.getElementById('userNameDisplay').textContent = user.email;
        document.getElementById('userRoleDisplay').textContent = profile.role || 'User';

        // ---- 3. Show the app ----
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('mainApp').style.display = 'block';

        // ---- 4. Check password expiry ----
        if (currentUser.must_change_password || new Date(currentUser.password_expiry) < new Date()) {
            document.getElementById('changePasswordError').textContent = '⚠️ Your password has expired — please set a new one.';
            document.getElementById('changePasswordModal').classList.add('active');
        }

        // ---- 5. Load data ----
        await loadUsersForSelects();
        await loadAll();

        console.log('✅ App ready');

    } catch (err) {
        console.error('💥 afterLogin error:', err);
        errorEl.textContent = '💥 Unexpected error: ' + err.message;
        // If app not shown, stay on login
        if (document.getElementById('mainApp').style.display === 'none') {
            document.getElementById('loginOverlay').classList.remove('hidden');
        }
    }
}

async function loadUsersForSelects() {
    const { data } = await sb.from('profiles').select('id, email, role');

function populateAssigneeSelect(selectEl) {
    if (!selectEl) return;
    const current = selectEl.value;
    selectEl.innerHTML = '<option value="">Unassigned</option>';
    (window._usersForSelect || []).forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.id;
        opt.textContent = u.email + (u.role ? ` (${u.role})` : '');
        selectEl.appendChild(opt);
    });
    selectEl.value = current;
}
function populateAssigneeFilters() {
    const filter = document.getElementById('ticketAssigneeFilter');
