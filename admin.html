<script>
// =============================================================
// SUPABASE & CONFIG — ⚠️ REPLACE WITH YOUR OWN VALUES
// =============================================================
const sb = supabase.createClient(
    'https://YOUR_PROJECT_REF.supabase.co',        // <--- Your Project URL
    'YOUR_ANON_PUBLIC_KEY'                          // <--- Your Anon Key
);
const FORMSPREE_ENDPOINT = 'https://formspree.io/f/mbgrrzja'; // keep or change

// =============================================================
// STATE
// =============================================================
let currentUser = null;
let allTickets = [];
let allClients = [];
let allUsers = [];
let currentEditId = null;
let selectedTicketIds = new Set();
let statusChart = null, priorityChart = null;

// =============================================================
// HELPERS (unchanged)
// =============================================================
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $ = id => document.getElementById(id);
function showLogin() { $('loginOverlay').classList.remove('hidden'); $('mainApp').style.display = 'none'; }
function showApp()   { $('loginOverlay').classList.add('hidden');    $('mainApp').style.display = 'block'; }
function closeModal(id) { $(id).classList.remove('active'); currentEditId = null; }
function switchTab(tab, btn) { /* unchanged */ }
function genTag() { return 'SPC-' + Math.floor(1000 + Math.random() * 9000); }

// =============================================================
// AUTH — FIXED WITH ERROR HANDLING
// =============================================================
async function checkSession() {
    try {
        const { data } = await sb.auth.getSession();
        if (!data.session) { showLogin(); return; }
        await afterLogin(data.session.user);
    } catch (err) {
        console.error('checkSession error:', err);
        showLogin();
        $('loginError').textContent = 'Session error: ' + err.message;
    }
}

async function handleLogin(e) {
    e.preventDefault();
    const errorEl = $('loginError');
    errorEl.textContent = '';
    const email = $('loginEmail').value.trim();
    const password = $('loginPassword').value.trim();

    if (!email || !password) {
        errorEl.textContent = 'Please enter both email and password.';
        return;
    }

    try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
            console.error('Login error:', error);
            errorEl.textContent = '❌ ' + error.message;
            return;
        }
        await afterLogin(data.user);
    } catch (err) {
        console.error('Unexpected login error:', err);
        errorEl.textContent = '❌ Unexpected error – see console (F12) for details.';
    }
}

async function afterLogin(user) {
    const errorEl = $('loginError');
    errorEl.textContent = '';

    try {
        // ---- 1. Fetch or create profile ----
        let { data: profile, error: profileError } = await sb
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .single();

        if (profileError && profileError.code !== 'PGRST116') { // not found
            console.error('Profile fetch error:', profileError);
            errorEl.textContent = '❌ Could not fetch profile: ' + profileError.message;
            return;
        }

        if (!profile) {
            // Try to create one
            const newProfile = {
                id: user.id,
                role: 'User',
                must_change_password: false,
                password_expiry: new Date(Date.now() + 30*864e5).toISOString(),
            };
            const { error: insertError } = await sb.from('profiles').insert([newProfile]);
            if (insertError) {
                console.error('Profile insert error:', insertError);
                errorEl.textContent = '❌ Failed to create profile: ' + insertError.message + 
                    '. Please ensure RLS policies allow INSERT on profiles.';
                return;
            }
            profile = newProfile;
        }

        // ---- 2. Set current user ----
        currentUser = { ...user, ...profile };
        $('userNameDisplay').textContent = user.email;
        $('userRoleDisplay').textContent = profile.role || 'User';

        // ---- 3. Show the app ----
        showApp();

        // ---- 4. Check password expiry ----
        if (currentUser.must_change_password || new Date(currentUser.password_expiry) < new Date()) {
            $('changePasswordError').textContent = '⚠️ Your password has expired — please set a new one.';
            $('changePasswordModal').classList.add('active');
        }

        // ---- 5. Load data ----
        await loadUsersForSelects();
        await loadAll();

    } catch (err) {
        console.error('afterLogin error:', err);
        errorEl.textContent = '❌ Unexpected error: ' + err.message;
        // Revert to login state if app not shown
        if (!$('mainApp').style.display || $('mainApp').style.display === 'none') {
            showLogin();
        }
    }
}

async function logout() {
    await sb.auth.signOut();
    currentUser = null; allTickets = []; allClients = [];
    showLogin();
}

// =============================================================
// LOAD ALL DATA (unchanged)
// =============================================================
async function loadAll() {
    await Promise.all([loadTickets(), loadClients(), loadUsers()]);
    updateDashboard();
    populateAssigneeFilters();
}
