<!DOCTYPE html>
<html lang="en">
<head>
<!-- (same head as before - unchanged) -->
</head>
<body>
<!-- (same HTML - unchanged except the JavaScript) -->

<script>
  // ============================================================
  //  WHATSAPP CONFIG — now sends to backend
  // ============================================================
  const STORE_WHATSAPP = '18763341156';
  const BACKEND_URL = 'https://your-api.example.com/api/send-whatsapp'; // 🔁 CHANGE THIS

  function sendWhatsAppToBackend(message, customerPhone = null) {
    return fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: message,
        customerPhone: customerPhone,
        storeNumber: STORE_WHATSAPP
      })
    })
    .then(res => {
      if (!res.ok) throw new Error('Backend responded with ' + res.status);
      return res.json();
    });
  }

  function normalizePhoneDigits(raw) {
    let digits = raw.replace(/\D/g, '');
    if (digits.length === 10) digits = '1' + digits;
    return digits;
  }

  // ============================================================
  //  IMAGE GALLERIES (unchanged)
  // ============================================================
  // ... (put your gallery code here, exactly as before) ...

  // ============================================================
  //  FIRESTICK
  // ============================================================
  var firestickBtn = document.getElementById('firestickBtn');
  if (firestickBtn) {
    firestickBtn.addEventListener('click', function(){
      var message = "Hey, I'm interested in a Firestick full setup with Live TV subscription. Please send me more information.";
      sendWhatsAppToBackend(message)
        .then(() => alert('Message sent! We\'ll get back to you shortly.'))
        .catch(() => alert('Could not send message. Please try again later.'));
    });
  }

  // ============================================================
  //  CUSTOM BUILT
  // ============================================================
  (function(){
    var buildLabels = {
      gaming: 'Gaming Machine',
      regular: 'Regular Computer'
    };
    var buildButtons = document.querySelectorAll('#custom-build .build-btn');
    var buildPanel = document.getElementById('buildPanel');
    var buildPanelTitle = document.getElementById('buildPanelTitle');
    var currentBuild = null;

    buildButtons.forEach(function(btn){
      btn.addEventListener('click', function(){
        currentBuild = btn.getAttribute('data-build');
        buildPanelTitle.textContent = "I'm Interested — " + buildLabels[currentBuild];
        buildPanel.hidden = false;
        buildPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });

    var buildForm = document.getElementById('buildForm');
    var buildPhoneInput = document.getElementById('buildPhone');

    buildPhoneInput.addEventListener('input', function(){
      buildPhoneInput.value = buildPhoneInput.value.replace(/\D/g, '').slice(0, 11);
    });

    buildForm.addEventListener('submit', function(e){
      e.preventDefault();
      var status = document.getElementById('buildFormStatus');
      var name = document.getElementById('buildName').value.trim();
      var digits = normalizePhoneDigits(buildPhoneInput.value);

      status.classList.remove('ok', 'err');

      if (!name) {
        status.textContent = 'Please enter your name.';
        status.classList.add('err');
        return;
      }
      if (digits.length !== 11) {
        status.textContent = 'Please enter your number with country code, digits only — e.g. 18765551234.';
        status.classList.add('err');
        return;
      }
      if (!currentBuild) {
        status.textContent = 'Please choose a category above first.';
        status.classList.add('err');
        return;
      }

      var message =
        'Hey, my name is ' + name + '. ' +
        'I am interested in a custom-built ' + buildLabels[currentBuild] + '. ' +
        'My number is ' + digits + '. Please send me more information.';

      status.textContent = 'Sending message…';
      sendWhatsAppToBackend(message, digits)
        .then(function(){
          status.textContent = 'Message sent! You\'ll hear from us soon.';
          status.classList.add('ok');
        })
        .catch(function(){
          status.textContent = 'Error sending. Please try again or contact us directly.';
          status.classList.add('err');
        });
    });
  })();

  // ============================================================
  //  REFURBISHED
  // ============================================================
  (function(){
    var refurbLabels = {
      'wfh-desktop': 'Work From Home Desktop',
      'wfh-laptop': 'Work From Home Laptop'
    };
    var refurbButtons = document.querySelectorAll('#refurbished .build-btn');
    var refurbPanel = document.getElementById('refurbPanel');
    var refurbPanelTitle = document.getElementById('refurbPanelTitle');
    var currentRefurb = null;

    refurbButtons.forEach(function(btn){
      btn.addEventListener('click', function(){
        currentRefurb = btn.getAttribute('data-build');
        refurbPanelTitle.textContent = "I'm Interested — " + refurbLabels[currentRefurb];
        refurbPanel.hidden = false;
        refurbPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });

    var refurbForm = document.getElementById('refurbForm');
    var refurbPhoneInput = document.getElementById('refurbPhone');

    refurbPhoneInput.addEventListener('input', function(){
      refurbPhoneInput.value = refurbPhoneInput.value.replace(/\D/g, '').slice(0, 11);
    });

    refurbForm.addEventListener('submit', function(e){
      e.preventDefault();
      var status = document.getElementById('refurbFormStatus');
      var name = document.getElementById('refurbName').value.trim();
      var digits = normalizePhoneDigits(refurbPhoneInput.value);

      status.classList.remove('ok', 'err');

      if (!name) {
        status.textContent = 'Please enter your name.';
        status.classList.add('err');
        return;
      }
      if (digits.length !== 11) {
        status.textContent = 'Please enter your number with country code, digits only — e.g. 18765551234.';
        status.classList.add('err');
        return;
      }
      if (!currentRefurb) {
        status.textContent = 'Please choose a category above first.';
        status.classList.add('err');
        return;
      }

      var message =
        'Hey, my name is ' + name + '. ' +
        'I am interested in this refurbished ' + refurbLabels[currentRefurb] + ' machine. ' +
        'My number is ' + digits + '. Please send me more information.';

      status.textContent = 'Sending message…';
      sendWhatsAppToBackend(message, digits)
        .then(function(){
          status.textContent = 'Message sent! You\'ll hear from us soon.';
          status.classList.add('ok');
        })
        .catch(function(){
          status.textContent = 'Error sending. Please try again or contact us directly.';
          status.classList.add('err');
        });
    });
  })();

  // ============================================================
  //  PAYMENT METHOD SELECTOR (unchanged)
  // ============================================================
  // ... (keep your existing payment method toggle code) ...

  // ============================================================
  //  BANK TRANSFER
  // ============================================================
  var bankForm = document.getElementById('bankForm');
  if (bankForm) {
    var bankPhoneInput = document.getElementById('bankPhone');

    bankPhoneInput.addEventListener('input', function(){
      bankPhoneInput.value = bankPhoneInput.value.replace(/\D/g, '').slice(0, 11);
    });

    bankForm.addEventListener('submit', function(e){
      e.preventDefault();
      var status = document.getElementById('bankFormStatus');
      var digits = normalizePhoneDigits(bankPhoneInput.value);

      status.classList.remove('ok', 'err');

      if (digits.length !== 11) {
        status.textContent = 'Please enter your number with country code, digits only — e.g. 18765551234.';
        status.classList.add('err');
        return;
      }

      var message = 'Hi StylesPC, I would like to pay by bank transfer. My number is ' + digits + '. Please send me your banking details.';
      status.textContent = 'Sending message…';
      sendWhatsAppToBackend(message, digits)
        .then(function(){
          status.textContent = 'Message sent! We\'ll reply with details shortly.';
          status.classList.add('ok');
        })
        .catch(function(){
          status.textContent = 'Error sending. Please try again.';
          status.classList.add('err');
        });
    });
  }

  // ============================================================
  //  HERO TICKET CYCLER (unchanged)
  // ============================================================
  // ... (keep your hero ticket cycling code) ...

  // ============================================================
  //  LIGHTBOX (unchanged)
  // ============================================================
  // ... (keep your lightbox code) ...

  // ============================================================
  //  FIRESTICK DEMO PHOTO (unchanged)
  // ============================================================
  // ... (keep the firestick photo probe) ...

  // ============================================================
  //  SUPABASE + BOOKING FORM
  // ============================================================
  var sbPublic = supabase.createClient(
    'https://gtfqasmqbgxjfnwlvxjp.supabase.co',
    'sb_publishable_t5wUt78t9oYjg_ngzVp5nA_E9m0WyM1'
  );

  var serviceTypeEl = document.getElementById('serviceType');
  var addressField = document.getElementById('address');
  var addressHint = document.getElementById('addressHint');
  serviceTypeEl.addEventListener('change', function(){
    var isPickup = serviceTypeEl.value === 'Pickup';
    addressHint.textContent = isPickup ? '(required for pickup)' : '(optional)';
    addressField.required = isPickup;
  });

  document.getElementById('bookForm').addEventListener('submit', function(e){
    e.preventDefault();
    var status = document.getElementById('formStatus');
    var submitBtn = document.getElementById('bookSubmitBtn');

    var name = document.getElementById('name').value.trim();
    var phoneRaw = document.getElementById('phone').value.trim();
    var email = document.getElementById('email').value.trim();
    var device = document.getElementById('device').value.trim();
    var serviceType = serviceTypeEl.value;
    var address = addressField.value.trim();
    var issue = document.getElementById('issue').value.trim();

    status.classList.remove('ok', 'err');

    if (!name || !phoneRaw || !device || !serviceType || !issue) {
      status.textContent = 'Please fill in all required fields.';
      status.classList.add('err');
      return;
    }
    if (serviceType === 'Pickup' && !address) {
      status.textContent = 'Please add a pickup address, or choose Drop-off instead.';
      status.classList.add('err');
      return;
    }

    var phoneDigits = normalizePhoneDigits(phoneRaw);
    if (phoneDigits.length !== 11) {
      status.textContent = 'Please enter a valid phone number with country code (e.g. 8763331156)';
      status.classList.add('err');
      return;
    }

    var returnMethod = serviceType === 'Remote' ? 'Remote' : serviceType;

    submitBtn.disabled = true;
    status.textContent = 'Booking your repair…';

    sbPublic.rpc('book_repair', {
      p_name: name,
      p_phone: phoneDigits,
      p_email: email,
      p_address: address,
      p_device: device,
      p_issue: issue,
      p_intake: serviceType,
      p_return: returnMethod
    }).then(function(res){
      submitBtn.disabled = false;
      if (res.error) {
        status.textContent = "Error saving booking. You can still contact us directly.";
        status.classList.add('err');
        console.error(res.error);
        return;
      }

      var ticketNumber = res.data;
      var message =
        'New Repair Booking — ' + ticketNumber + '\n' +
        'Name: ' + name + '\n' +
        'Phone: ' + phoneRaw + '\n' +
        (email ? 'Email: ' + email + '\n' : '') +
        'Device: ' + device + '\n' +
        'Preferred service: ' + serviceType + '\n' +
        (address ? 'Address: ' + address + '\n' : '') +
        'Issue: ' + issue;

      status.textContent = 'Booking saved! Sending notification…';
      sendWhatsAppToBackend(message, phoneDigits)
        .then(function(){
          status.textContent = 'Booked! Ticket ' + ticketNumber + '. We\'ll confirm via WhatsApp.';
          status.classList.add('ok');
          document.getElementById('bookForm').reset();
          addressHint.textContent = '(optional)';
          addressField.required = false;
        })
        .catch(function(){
          status.textContent = 'Booking saved but notification failed. We\'ll still contact you.';
          status.classList.add('ok');
        });
    });
  });

  // ============================================================
  //  FLOATING WHATSAPP BUTTON & NAV CHAT (now also via backend)
  // ============================================================
  document.getElementById('whatsappFloat').addEventListener('click', function(e) {
    e.preventDefault();
    var msg = "Hi StylesPC, I need help with a computer repair or service.";
    sendWhatsAppToBackend(msg)
      .then(() => alert('Message sent! We\'ll reply soon.'))
      .catch(() => alert('Error sending. Please try again later.'));
  });

  document.getElementById('navWhatsApp').addEventListener('click', function(e) {
    e.preventDefault();
    var msg = "Hi, I have a quick question about your repair services.";
    sendWhatsAppToBackend(msg)
      .then(() => alert('Message sent! We\'ll get back to you.'))
      .catch(() => alert('Error sending. Please try again.'));
  });

</script>

</body>
</html>
